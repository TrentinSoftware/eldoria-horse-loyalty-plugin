# Tempo e distância para ganhar XP montado
riding-xp-per-second: 1
riding-xp-per-block: 10

# XP por alimentação
feeding:
  apple: 1
  golden_apple: 20
  enchanted_golden_apple: 200

# XP necessário para cada nível (índice 0 = nível 1)
level-xp-requirements:
  - 20
  - 40
  - 60
  - 80
  - 100
  - 120
  - 140
  - 160
  - 180
  - 200

# Efeitos de level-up
level-up-sound: ENTITY_PLAYER_LEVELUP
level-up-message: "&bSeu cavalo subiu para o nível &l%level%&b!"

# Bônus de velocidade por nível de lealdade
speed-bonus:
  enabled: true
  per-level: 0.1

# Nome automático ao atingir determinado nível
auto-name:
  enabled: true
  level: 3
  name: "&eCavalo Leal"

# Comandos usados pelos botões do catálogo
call-command: "callhorse"
favorite-command: "favoritehorse"
rename-command: "lealdadecavalo rename"   # comando base para renomear (o UUID será anexado)

# Níveis de habilidade (configuráveis por /horselealdade config set)
max-level: 10
exclusive-mount-level: 5
call-level: 8
favorite-level: 10

# Mensagens de ajuda para jogadores comuns
help-player:
  - "&a/lealdadecavalo get &7- Mostra lealdade e XP do cavalo"
  - "&a/lealdadecavalo item &7- Obtém uma ficha de cavalo"
  - "&a/lealdadecavalo rename <UUID> &7- Renomeia um cavalo (clique no botão do catálogo)"
  - "&a/lealdadecavalo help &7- Mostra esta ajuda"
  - "&a/horsecatalog &7- Obtém o livro de catálogo"
  - "&a/callhorse <UUID> &7- Chama um cavalo (nível 8+)"
  - "&a/favoritehorse <UUID> &7- Favorita um cavalo (nível 10)"
  - "&a/vemcapocoto &7- Chama o cavalo favorito"

# Mensagens de ajuda para administradores (apenas com permissão lealdadecavalo.admin)
help-admin:
  - "&c/lealdadecavalo set <nível> &7- Define a lealdade (admin)"
  - "&c/lealdadecavalo config <get|set|add|remove> <chave> [valor] &7- Configura o plugin (admin)"

# Passageiro duplo removido.

# Cooldown para chamar o cavalo
call-cooldown:
  enabled: false
  base-seconds: 10

# Alcance máximo para chamar o cavalo (por nível de lealdade)
call-range:
  enabled: true
  range-per-level:
    - 50
    - 60
    - 70
    - 80
    - 100
    - 120
    - 140
    - 160
    - 180
    - 200